name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  render-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run render-report tests
        working-directory: render-report
        run: python3 -m unittest discover --start-directory . --verbose
