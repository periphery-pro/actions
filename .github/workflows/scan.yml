name: Periphery scan

on:
  workflow_call:
    inputs:
      fetch_depth:
        description: Number of commits to fetch. Zero fetches the complete history.
        required: false
        type: number
        default: 0
      checkout_submodules:
        description: Recursively check out the caller repository's Git submodules.
        required: false
        type: boolean
        default: false
      setup:
        description: Bash script to run in the caller repository before scanning.
        required: false
        type: string
        default: ""
      periphery_version:
        description: Exact Periphery CLI release tag to use. Defaults to the latest release.
        required: false
        type: string
      run_without_baseline:
        description: Run pull-request scans when no merge-base baseline is available.
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  scan:
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: ${{ inputs.checkout_submodules && 'recursive' || 'false' }}

      - name: Run setup
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: |
          bash -euo pipefail -c "$SETUP"

      - name: Find baseline
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FETCH_DEPTH: ${{ inputs.fetch_depth }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_WITHOUT_BASELINE: ${{ inputs.run_without_baseline }}
        run: |
          set -euo pipefail
          if [[ "$FETCH_DEPTH" != "0" ]]; then
            git fetch --no-tags --depth="$FETCH_DEPTH" origin "$BASE_SHA"
          fi
          merge_base="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
          artifact_name="periphery-baseline-$merge_base"
          export MERGE_BASE="$merge_base"
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == env.MERGE_BASE)] | sort_by(.created_at) | last | .workflow_run.id // empty'
          )"

          {
            echo "artifact_name=$artifact_name"
            echo "merge_base=$merge_base"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$run_id" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "$RUN_WITHOUT_BASELINE" == "true" ]]; then
              echo "::notice title=Periphery baseline unavailable::No baseline is available for merge-base $merge_base. Running without a baseline."
            else
              echo "::notice title=Periphery scan skipped::No baseline is available for merge-base $merge_base."
            fi
          fi

      - name: Download baseline
        if: github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          path: ${{ runner.temp }}/periphery-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run_id }}

      - name: Download Periphery CLI
        if: github.event_name != 'pull_request' || steps.baseline.outputs.available == 'true' || inputs.run_without_baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERIPHERY_VERSION: ${{ inputs.periphery_version }}
        run: |
          set -euo pipefail
          releases_url="https://api.github.com/repos/periphery-pro/cli-releases/releases"
          version="$PERIPHERY_VERSION"
          api_args=(
            --header "Accept: application/vnd.github+json"
            --header "Authorization: Bearer $GITHUB_TOKEN"
            --header "X-GitHub-Api-Version: 2022-11-28"
            --location
            --retry 3
            --silent
            --show-error
          )

          if [[ -n "$version" ]]; then
            release="$(curl --fail "${api_args[@]}" "$releases_url/tags/$version")"
          else
            release_file="$RUNNER_TEMP/periphery-release.json"
            status="$(curl "${api_args[@]}" --output "$release_file" --write-out '%{http_code}' "$releases_url/latest")"
            case "$status" in
              200)
                release="$(<"$release_file")"
                ;;
              404)
                release="$(curl --fail "${api_args[@]}" "$releases_url?per_page=1" | jq -ce 'first')"
                ;;
              *)
                echo "Failed to resolve the latest Periphery release (HTTP $status)" >&2
                exit 1
                ;;
            esac
          fi

          asset="$(jq -cer '[.assets[] | select(.name | test("^periphery-cli_.*_macos_arm64\\.zip$"))] | first' <<< "$release")"
          asset_name="$(jq -r '.name' <<< "$asset")"
          asset_url="$(jq -r '.browser_download_url' <<< "$asset")"
          asset_digest="$(jq -r '.digest // empty' <<< "$asset")"
          [[ "$asset_digest" == sha256:* ]] || { echo "Release asset is missing a SHA-256 digest: $asset_name" >&2; exit 1; }

          archive="$RUNNER_TEMP/$asset_name"
          curl --fail --location --retry 3 --silent --show-error --output "$archive" "$asset_url"
          printf '%s  %s\n' "${asset_digest#sha256:}" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/periphery"
          chmod +x "$RUNNER_TEMP/periphery/periphery"

      - name: Scan
        id: scan
        if: github.event_name != 'pull_request' || steps.baseline.outputs.available == 'true' || inputs.run_without_baseline
        env:
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
        run: |
          set -euo pipefail
          args=(scan --oss --relative-results)

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--format github-actions)
            if [[ "$BASELINE_AVAILABLE" == "true" ]]; then
              args+=(--baseline "$RUNNER_TEMP/periphery-baseline/periphery-baseline.json")
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--write-baseline "$RUNNER_TEMP/periphery-baseline.json")
          fi

          "$RUNNER_TEMP/periphery/periphery" "${args[@]}" | tee "$RUNNER_TEMP/periphery-output.txt"

      - name: Render report
        if: always() && github.event_name == 'pull_request' && steps.scan.outcome != 'skipped'
        uses: periphery-pro/actions/render-report@feat/job-summary
        with:
          annotations: ${{ runner.temp }}/periphery-output.txt
          baseline_commit: ${{ steps.baseline.outputs.available == 'true' && steps.baseline.outputs.merge_base || '' }}
          blob_url: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.head.sha }}
          commit_url: ${{ github.server_url }}/${{ github.repository }}/commit
          logo_url: https://raw.githubusercontent.com/periphery-pro/actions/main/assets/logo.svg
          output: ${{ runner.temp }}/periphery-comment/comment.md

      - name: Write job summary
        if: always() && github.event_name == 'pull_request' && steps.scan.outcome != 'skipped'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/periphery-comment"
          [[ -f "$payload/comment.md" ]] || exit 0

          printf '%s\n' "$PR_NUMBER" > "$payload/pr-number"
          cat "$payload/comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comment payload
        if: always() && github.event_name == 'pull_request' && steps.scan.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: periphery-comment
          path: ${{ runner.temp }}/periphery-comment
          if-no-files-found: ignore
          overwrite: true

      - name: Upload baseline
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: periphery-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/periphery-baseline.json
          if-no-files-found: error
          overwrite: true

      - name: Report scan
        if: always() && steps.scan.outcome != 'skipped'
        continue-on-error: true
        run: '"$RUNNER_TEMP/periphery/periphery" report-scan --oss'
