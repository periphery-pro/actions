name: Periphery scan

on:
  workflow_call:
    inputs:
      run_without_baseline:
        description: Run pull-request scans when no merge-base baseline is available.
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  scan:
    runs-on: macos-15
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Find baseline
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_WITHOUT_BASELINE: ${{ inputs.run_without_baseline }}
        run: |
          set -euo pipefail
          merge_base="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
          artifact_name="periphery-baseline-$merge_base"
          export MERGE_BASE="$merge_base"
          run_id="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact_name&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == env.MERGE_BASE)] | sort_by(.created_at) | last | .workflow_run.id // empty'
          )"

          {
            echo "artifact_name=$artifact_name"
            echo "merge_base=$merge_base"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "$run_id" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "$RUN_WITHOUT_BASELINE" == "true" ]]; then
              echo "::notice title=Periphery baseline unavailable::No baseline is available for merge-base $merge_base. Running without a baseline."
            else
              echo "::notice title=Periphery scan skipped::No baseline is available for merge-base $merge_base."
            fi
          fi

      - name: Download baseline
        if: github.event_name == 'pull_request' && steps.baseline.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          path: ${{ runner.temp }}/periphery-baseline
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run_id }}

      - name: Download Periphery CLI
        if: github.event_name != 'pull_request' || steps.baseline.outputs.available == 'true' || inputs.run_without_baseline
        env:
          PERIPHERY_VERSION: "1.0.0.beta.3"
          PERIPHERY_ASSET: "periphery-cli_1.0.0.beta.3_macos_arm64.zip"
          PERIPHERY_SHA256: "cb64814d35ea782f4cbd8544cf2f801798126668bfd177729a3ce735281410e8"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/$PERIPHERY_ASSET"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/periphery-pro/cli-releases/releases/download/$PERIPHERY_VERSION/$PERIPHERY_ASSET"
          printf '%s  %s\n' "$PERIPHERY_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/periphery"
          chmod +x "$RUNNER_TEMP/periphery/periphery"

      - name: Scan
        id: scan
        if: github.event_name != 'pull_request' || steps.baseline.outputs.available == 'true' || inputs.run_without_baseline
        env:
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
        run: |
          set -euo pipefail
          args=(scan --oss --relative-results)

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(--format github-actions)
            if [[ "$BASELINE_AVAILABLE" == "true" ]]; then
              args+=(--baseline "$RUNNER_TEMP/periphery-baseline/periphery-baseline.json")
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            args+=(--write-baseline "$RUNNER_TEMP/periphery-baseline.json")
          fi

          "$RUNNER_TEMP/periphery/periphery" "${args[@]}"

      - name: Upload baseline
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: periphery-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/periphery-baseline.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

      - name: Report scan
        if: always() && steps.scan.outcome != 'skipped'
        continue-on-error: true
        run: '"$RUNNER_TEMP/periphery/periphery" report-scan --oss'
