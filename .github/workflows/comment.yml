name: Periphery comment

on:
  workflow_call:

permissions: {}

jobs:
  comment:
    # Pull-request runs from forks receive a read-only token, so the comment cannot be
    # posted by the scan itself. This workflow runs in the base repository instead,
    # triggered by the completion of the scan run.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Find comment payload
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          count="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=periphery-comment" \
              --jq '[.artifacts[] | select(.expired == false)] | length'
          )"

          if [[ "$count" == "0" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Periphery comment skipped::Run $RUN_ID published no comment payload."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download comment payload
        if: steps.payload.outputs.available == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: periphery-comment
          path: ${{ runner.temp }}/periphery-comment
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Post comment
        if: steps.payload.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/periphery-comment"

          if [[ ! -f "$payload/comment.md" || ! -f "$payload/pr-number" ]]; then
            echo "Comment payload is incomplete" >&2
            exit 1
          fi

          # The payload is produced by a run of the pull request's own code, so treat it
          # strictly as data and reject anything that is not a plain number.
          pr="$(head -n 1 "$payload/pr-number" | tr -d '[:space:]')"

          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "Comment payload has an invalid pull-request number" >&2
            exit 1
          fi

          # Bind the payload to the run that produced it, so a crafted number cannot
          # redirect the comment at an unrelated pull request.
          pr_head="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha')"

          if [[ "$pr_head" != "$RUN_HEAD_SHA" ]]; then
            echo "::notice title=Periphery comment skipped::Pull request $pr is no longer at $RUN_HEAD_SHA."
            exit 0
          fi

          marker='<!-- periphery-scan -->'
          body="$RUNNER_TEMP/comment-body.md"
          { printf '%s\n' "$marker"; cat "$payload/comment.md"; } > "$body"
          jq -n --rawfile body "$body" '{body: $body}' > "$RUNNER_TEMP/comment.json"

          existing="$(
            gh api "/repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate \
              --jq '.[] | select(.body | startswith("<!-- periphery-scan -->")) | .id' | tail -1
          )"

          if [[ -n "$existing" ]]; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              --input "$RUNNER_TEMP/comment.json" --silent
            echo "Updated comment $existing on pull request $pr"
          else
            gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
              --input "$RUNNER_TEMP/comment.json" --silent
            echo "Created a comment on pull request $pr"
          fi
